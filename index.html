<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Tornike Khutsishvili">

    <link rel="stylesheet" href="style.css">

    <title>Lotto Game</title>

</head>
<body>

  <div class="btn_number_main_div">
    <div class="buttons"></div>
  </div>

  <div class="btn_h1">
    <div class="win_number_div">
      <h2 class="win">Win Number</h2>
      <button type="button" class="win_number" title="button"><span class="winSpan"></span></button>
      <button type="button" class="win_number" title="button"><span class="winSpan"></span></button>
      <button type="button" class="win_number" title="button"><span class="winSpan"></span></button>
      <button type="button" class="win_number" title="button"><span class="winSpan"></span></button>
      <button type="button" class="win_number" title="button"><span class="winSpan"></span></button>
      <button type="button" class="win_number" title="button"><span class="winSpan"></span></button>
    </div>

    <div>
      <h2 class="choiseText">You chosen numbers: </h2>
      <h3 class="choiseNumb"></h3>
    </div>

    <button type="button" class="btn_start" title="start">START</button>
    <button type="button" class="btn_restart">RESTART</button>

    <h3 class="win_h3"></h3>
    <h1 class="win_h1"></h1>
    <h1 class="lose_h1"></h1>
  </div>



  <script type="module" src="script.js" defer></script>

</body>
</html>
